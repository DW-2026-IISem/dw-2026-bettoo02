<aside class="w-68 bg-gradient-to-b from-slate-900 via-slate-900 to-slate-950 text-slate-200 h-full flex flex-col justify-between p-4 select-none shrink-0 border-r border-slate-800/80 shadow-xl">
  <div class="space-y-6 overflow-y-auto pr-1">
    @for (group of navGroups(); track group.title) {
      <div>
        <p class="px-3 text-[11px] font-bold uppercase tracking-widest text-slate-400/90 mb-2">
          {{ group.title }}
        </p>

        <ul class="space-y-1 text-sm">
          @for (item of group.items; track item.route) {
            <li>
              <a
                [routerLink]="item.route"
                routerLinkActive="bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-semibold shadow-md shadow-emerald-950/50"
                class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl hover:bg-slate-800/80 hover:text-white text-slate-300 cursor-pointer transition-all duration-150"
              >
                <i [class]="item.icon + ' text-base'"></i>
                <span class="truncate">{{ item.label }}</span>
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </div>

  <div class="pt-4 mt-4 border-t border-slate-800/90">
    <div class="rounded-xl bg-slate-800/60 border border-slate-700/60 p-3 text-xs text-slate-300 space-y-1">
      <div class="flex items-center justify-between">
        <span class="font-bold text-white">Arrendo360 v1.0</span>
        <span class="px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 font-semibold text-[10px]">2026</span>
      </div>
      <p class="text-[11px] text-slate-400">Ingeniería de Sistemas · Uniguajira</p>
    </div>
  </div>
</aside>
