<header class="h-16 bg-white/95 backdrop-blur-md border-b border-slate-200/90 px-6 flex items-center justify-between shadow-2xs sticky top-0 z-30">
  <div class="flex items-center gap-3.5">
    <p-button
      [icon]="sidebarOpen() ? 'pi pi-bars' : 'pi pi-align-left'"
      [rounded]="true"
      [text]="true"
      severity="secondary"
      (onClick)="toggleSidebar.emit()"
      title="Mostrar / ocultar menú lateral"
    />

    <a routerLink="/dashboard" class="flex items-center gap-3 group cursor-pointer">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-700 text-white flex items-center justify-center shadow-sm group-hover:scale-105 transition-transform">
        <i class="pi pi-building text-lg"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-lg font-extrabold text-slate-800 tracking-tight leading-none">Arrendo360</h1>
          <span class="text-[10px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800">PRO</span>
        </div>
        <p class="text-xs text-slate-500 mt-0.5">Plataforma de Gestión Inmobiliaria</p>
      </div>
    </a>
  </div>

  <div class="flex items-center gap-4">
    <span class="hidden sm:inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200/80">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      API Activa :3002
    </span>

    @if (authService.currentUser(); as user) {
      <div class="flex items-center gap-3 pl-3 border-l border-slate-200">
        <a
          routerLink="/login"
          class="flex items-center gap-2.5 px-2.5 py-1.5 rounded-xl hover:bg-slate-100 transition-colors cursor-pointer"
          title="Ver detalles de sesión JWT (/me)"
        >
          <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-emerald-600 to-teal-500 text-white font-bold text-xs flex items-center justify-center shadow-2xs">
            {{ user.nombre.slice(0, 1).toUpperCase() }}
          </div>
          <div class="hidden md:block text-left">
            <p class="text-xs font-bold text-slate-800 leading-tight">{{ user.nombre }}</p>
            <p class="text-[10px] text-slate-500 leading-tight">{{ user.email }}</p>
          </div>
        </a>

        <p-tag [value]="user.role" severity="info" />

        <p-button
          icon="pi pi-power-off"
          label="Salir"
          size="small"
          severity="danger"
          [outlined]="true"
          title="Cerrar Sesión (Logout)"
          (onClick)="authService.logout()"
        />
      </div>
    } @else {
      <a routerLink="/login">
        <p-button
          label="Iniciar Sesión"
          icon="pi pi-sign-in"
          size="small"
          severity="success"
        />
      </a>
    }
  </div>
</header>
